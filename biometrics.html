<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>mObywatel</title>
  <link rel="stylesheet" href="assets/moreid.css">
  <link rel="stylesheet" href="assets/main.css">
  <link rel="icon" type="image/x-icon" href="https://i.imgur.com/U7TRg0V.png">
  <link rel="apple-touch-icon" href="https://i.imgur.com/U7TRg0V.png">
  <link rel="shortcut icon" href="https://i.imgur.com/U7TRg0V.png">
  <meta name="viewport" content="width=device-width, initial-scale=0.8, user-scalable=no">
  <style>
    .switch-container { display: flex; align-items: center; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .switch-container:last-child { border-bottom: none; }
    .switch-label { color: #fff; font-size: 16px; }
    .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #014a93; }
    input:checked + .slider:before { transform: translateX(24px); }
  </style>
</head>
<body>
  <div class="top_grid">
    <div class="action_grid">
      <img src="https://i.imgur.com/aXIO2NG.png" class="back_img">
      <p onclick="sendTo('more')" class="back_text">Wróć</p>
    </div>
    <p class="title_text" style="font-size:16px; margin-left:-20px;">Biometria</p>
    <img src="https://i.imgur.com/VHNv1TC.png" class="help_img">
  </div>

  <div class="card custom-card">
    <div class="switch-container">
      <span class="switch-label">Logowanie twarzą (Face ID)</span>
      <label class="switch">
        <input type="checkbox" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="switch-container">
      <span class="switch-label">Logowanie odciskiem palca</span>
      <label class="switch">
        <input type="checkbox">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <script src="assets/bar.js"></script>
  <script src="assets/manifest.js"></script>
</body>
</html>
