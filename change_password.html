<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>mObywatel</title>
  <link rel="stylesheet" href="assets/moreid.css">
  <link rel="stylesheet" href="assets/main.css">
  <link rel="icon" type="image/x-icon" href="https://i.imgur.com/U7TRg0V.png">
  <link rel="apple-touch-icon" href="https://i.imgur.com/U7TRg0V.png">
  <link rel="shortcut icon" href="https://i.imgur.com/U7TRg0V.png">
  <meta name="viewport" content="width=device-width, initial-scale=0.8, user-scalable=no">
  <style>
    .input-group { margin-bottom: 20px; }
    .input-group label { display: block; color: #fff; margin-bottom: 8px; font-size: 15px; }
    .input-group input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.5); color: #fff; font-size: 16px; box-sizing: border-box; }
    .input-group input:focus { border-color: #4ba4fe; outline: none; }
    .save-btn { width: 100%; padding: 16px; background-color: #014a93; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
    .save-btn:hover { background-color: #0b294c; }
  </style>
</head>
<body>
  <div class="top_grid">
    <div class="action_grid">
      <img src="https://i.imgur.com/aXIO2NG.png" class="back_img">
      <p onclick="sendTo('more')" class="back_text">Wróć</p>
    </div>
    <p class="title_text">Zmień hasło</p>
    <img src="https://i.imgur.com/VHNv1TC.png" class="help_img">
  </div>

  <div class="card custom-card">
    <div class="input-group">
      <label>Obecne hasło</label>
      <input type="password" placeholder="••••••••">
    </div>
    <div class="input-group">
      <label>Nowe hasło</label>
      <input type="password" placeholder="••••••••">
    </div>
    <div class="input-group">
      <label>Powtórz nowe hasło</label>
      <input type="password" placeholder="••••••••">
    </div>
    <button class="save-btn" onclick="alert('Hasło zostało zmienione pomyślnie!')">Zapisz hasło</button>
  </div>

  <script src="assets/bar.js"></script>
  <script src="assets/manifest.js"></script>
</body>
</html>
